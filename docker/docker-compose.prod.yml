services:
  postgres:
    image: postgres:16-alpine
    container_name: parking-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-parking}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-parking}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-parking} -d ${DB_NAME:-parking}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parking-network

  redis:
    image: redis:7-alpine
    container_name: parking-redis
    restart: always
    # noeviction: Redis holds ARQ jobs, command streams, PELs, payment arm
    # state and JWT denylist entries — silent LRU eviction of any of those
    # loses money records or delivered commands. Writes error loudly instead.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - parking-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: parking-api
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-parking}
      - DB_USER=${DB_USER:-parking}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - parking-network
    command: >
      gunicorn api.app.main:app
      -w 4
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: parking-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - parking-network

  worker-critical:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: parking-worker-critical
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-parking}
      - DB_USER=${DB_USER:-parking}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      - redis
      - postgres
    networks:
      - parking-network
    command: arq workers.settings.CriticalWorkerSettings

  # Single-instance Redis Pub/Sub consumer. MUST NOT scale >1 or run inside
  # the API (4 gunicorn workers → every gate event handled 4x → duplicate
  # transactions/deducts). Without this container, gate events are published
  # but nobody creates transactions or opens gates.
  events:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: parking-events
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-parking}
      - DB_USER=${DB_USER:-parking}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - parking-network
    command: python -m api.app.services.event_consumer_main

  worker-bg:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: parking-worker-bg
    restart: always
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-parking}
      - DB_USER=${DB_USER:-parking}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      - redis
      - postgres
    networks:
      - parking-network
    command: arq workers.settings.BackgroundWorkerSettings

volumes:
  postgres_data:
  redis_data:

networks:
  parking-network:
    driver: bridge
